name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix selfhost ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: node scripts/package.mjs
      - run: sudo env "PATH=$PATH" python3 tests/broker_integration.py
      - run: python3 -m compileall -q pi-admin
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script" || exit 1
          done < <(find pi-admin selfhost -name '*.sh' -print0)
      - run: python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: browser-vault-install-bundles
          path: dist/*.tar.gz
